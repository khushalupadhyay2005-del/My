<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorry Piya ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffb6c9, #ffe5ed, #ffd0df);
    font-family: Arial, sans-serif;
}

/* Background hearts */
.heart-bg {
    position: fixed;
    bottom: -50px;
    animation: floatHeart linear forwards;
    opacity: 0;
    pointer-events: none;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) scale(0.5) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) scale(1.2) rotate(360deg);
        opacity: 0;
    }
}

/* Main card */
.card {
    width: 90%;
    max-width: 430px;
    padding: 30px 22px;
    text-align: center;
    background: rgba(255,255,255,0.92);
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(160,40,80,0.25);
    position: relative;
    z-index: 10;
    animation: cardAppear 1.5s ease;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(60px) scale(0.8);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Heart */
.big-heart {
    font-size: 75px;
    animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}

h1 {
    margin-top: 10px;
    color: #e91e63;
    font-size: 42px;
    animation: titleIn 2s ease;
}

@keyframes titleIn {
    0% {
        opacity: 0;
        transform: scale(0.5);
    }

    70% {
        transform: scale(1.1);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

.name {
    margin-top: 8px;
    font-size: 28px;
    font-weight: bold;
    color: #333;
}

/* Message */
.message {
    margin-top: 20px;
    min-height: 180px;
    color: #555;
    font-size: 17px;
    line-height: 1.7;
}

#typing {
    white-space: pre-line;
}

/* Button */
button {
    border: none;
    padding: 14px 28px;
    border-radius: 30px;
    background: #e91e63;
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(233,30,99,0.3);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
}

button:active {
    transform: scale(0.95);
}

/* Final message */
#finalMessage {
    display: none;
    margin-top: 22px;
    color: #e91e63;
    font-size: 21px;
    font-weight: bold;
    animation: finalPop 1s ease;
}

@keyframes finalPop {
    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Music */
.music {
    margin-top: 20px;
    color: #888;
    font-size: 14px;
}

audio {
    width: 100%;
    margin-top: 8px;
}

/* Heart burst */
.burst {
    position: fixed;
    pointer-events: none;
    font-size: 25px;
    z-index: 100;
    animation: burstAnimation 1.5s ease-out forwards;
}

@keyframes burstAnimation {
    0% {
        transform: translate(0,0) scale(0.5);
        opacity: 1;
    }

    100% {
        transform: translate(var(--x), var(--y)) scale(1.5);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="big-heart">❤️</div>

    <h1>I'm Sorry</h1>

    <div class="name">Piya 🥺❤️</div>

    <div class="message">
        <div id="typing"></div>
    </div>

    <button onclick="forgiveMe()">
        Please Forgive Me 🥺❤️
    </button>

    <div id="finalMessage">
        Thank You Piya ❤️🫂<br>
        You Mean So Much To Me 💕
    </div>

    <div class="music">
        🎵 Our Special Song
        <audio controls>
            <source src="love-song.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>
    </div>

</div>


<script>

/* =========================
   TYPING ANIMATION
========================= */

const text =
`Piya... 🥺❤️

Mujhse jo bhi galti hui hai,
uske liye dil se Sorry.

Mera intention tumhe hurt karna
kabhi nahi tha. 🫂

Please meri galti ko maaf kar do. 🥺

Tum mere liye bahut special ho. ❤️`;

let index = 0;

function typeText() {

    if (index < text.length) {

        document.getElementById("typing").textContent += text.charAt(index);

        index++;

        setTimeout(typeText, 35);
    }
}

setTimeout(typeText, 1500);


/* =========================
   FLOATING HEARTS
========================= */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart-bg";

    const hearts = ["❤️","💕","💗","💖","💓","🥺"];

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);
}

setInterval(createHeart, 450);


/* =========================
   FORGIVE BUTTON
========================= */

function forgiveMe() {

    document.getElementById("finalMessage").style.display = "block";

    heartBurst();

}


/* =========================
   HEART BURST
========================= */

function heartBurst() {

    const symbols = ["❤️","💕","💖","💗","✨"];

    for (let i = 0; i < 35; i++) {

        const heart = document.createElement("div");

        heart.className = "burst";

        heart.innerHTML =
            symbols[Math.floor(Math.random() * symbols.length)];

        heart.style.left = "50%";
        heart.style.top = "55%";

        const x =
            (Math.random() - 0.5) * 500 + "px";

        const y =
            (Math.random() - 0.5) * 500 + "px";

        heart.style.setProperty("--x", x);
        heart.style.setProperty("--y", y);

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 1600);
    }
}

</script>

</body>
      </html>
